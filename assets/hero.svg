<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Sasuke Frontend Dev — product engineer</title>
  <desc id="desc">An animated orbital interface introducing a product engineer who builds private, polished software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090817"/>
      <stop offset="0.5" stop-color="#17152e"/>
      <stop offset="1" stop-color="#090817"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8175ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9ff57"/>
      <stop offset="1" stop-color="#8175ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#d9ff57" stop-opacity=".95"/>
      <stop offset=".32" stop-color="#8175ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8175ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8175ff" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="frame"><rect x="10" y="10" width="1180" height="480" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#grid)"/>
    <circle cx="965" cy="250" r="250" fill="url(#core)" opacity=".24">
      <animate attributeName="opacity" values=".16;.34;.16" dur="4s" repeatCount="indefinite"/>
    </circle>

    <g fill="none" transform="translate(960 250)">
      <ellipse rx="202" ry="202" stroke="#8175ff" stroke-opacity=".2"/>
      <ellipse rx="154" ry="154" stroke="#8175ff" stroke-opacity=".28" stroke-dasharray="3 13">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="108" ry="108" stroke="#d9ff57" stroke-opacity=".35" stroke-dasharray="1 10">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="66" fill="#111025" stroke="#8175ff" stroke-width="2"/>
      <circle r="55" fill="none" stroke="#8175ff" stroke-opacity=".22" stroke-dasharray="2 7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <path d="M-18-20 0-38 18-20 0-2Z" fill="none" stroke="#d9ff57" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
      <path d="M-7-20 0-13 10-24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-31" y="14" width="62" height="24" rx="12" fill="#8175ff" fill-opacity=".2" stroke="#8175ff" stroke-opacity=".55"/>
      <text x="0" y="30" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="2">SHIP</text>
      <circle r="4" cy="50" fill="#ff745e" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <g>
        <circle cx="0" cy="-154" r="7" fill="#d9ff57" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="202" cy="0" r="6" fill="#ff745e" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
      </g>
    </g>

    <path d="M70 76H550" stroke="url(#beam)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0 480;240 240;0 480" dur="5s" repeatCount="indefinite"/>
    </path>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="70" y="112" fill="#d9ff57" font-size="15" letter-spacing="4">SYSTEM // BUILDER ONLINE</text>
      <text x="70" y="203" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-3">SASUKE</text>
      <text x="70" y="265" fill="#a9a4c8" font-size="38" font-weight="600" letter-spacing="5">FRONTEND DEV</text>
      <text x="70" y="321" fill="#e9e7ff" font-size="19">I turn ambitious ideas into products people can feel.</text>
      <text x="70" y="373" fill="#8175ff" font-size="14" letter-spacing="2">NATIVE APPS</text>
      <circle cx="223" cy="368" r="3" fill="#ff745e"/>
      <text x="240" y="373" fill="#8175ff" font-size="14" letter-spacing="2">PRIVACY</text>
      <circle cx="348" cy="368" r="3" fill="#ff745e"/>
      <text x="365" y="373" fill="#8175ff" font-size="14" letter-spacing="2">POLISHED WEB</text>
      <rect x="70" y="414" width="490" height="42" rx="21" fill="#8175ff" fill-opacity=".1" stroke="#8175ff" stroke-opacity=".35"/>
      <circle cx="94" cy="435" r="5" fill="#d9ff57">
        <animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="112" y="441" fill="#d9ff57" font-size="15">CURRENT MISSION: BUILD ORBITDROP</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#625d82">
      <text x="1070" y="462">BUILD / 2026</text>
      <text x="954" y="177" text-anchor="middle" fill="#8175ff" font-size="9" letter-spacing="3">IDEA IN ORBIT</text>
    </g>
  </g>
  <rect x="10" y="10" width="1180" height="480" rx="30" fill="none" stroke="#8175ff" stroke-opacity=".28"/>
</svg>
