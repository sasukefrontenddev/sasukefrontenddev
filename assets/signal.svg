<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Animated signal divider">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#8175ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#8175ff"/>
      <stop offset=".55" stop-color="#d9ff57"/>
      <stop offset="1" stop-color="#8175ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="72" fill="#090817" fill-opacity="0"/>
  <path d="M0 36h350l18-14 18 28 22-42 28 56 24-46 20 36 16-18h704" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
